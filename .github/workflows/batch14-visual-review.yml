name: Batch 14 Visual Review

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/ui/**'
      - 'src/app/**'
      - 'src/App.tsx'
      - 'tests/visual/**'
      - 'scripts/qa/validate-batch14-review-hygiene.mjs'
      - 'docs/qa/BATCH-14-VISUAL-REVIEW.md'
      - 'AGENTS.md'
      - 'CLAUDE.md'
      - 'playwright.config.ts'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/batch14-visual-review.yml'

permissions:
  contents: read

concurrency:
  group: batch14-visual-review-${{ github.ref }}
  cancel-in-progress: true

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Chromium for review capture
        run: pnpm exec playwright install --with-deps chromium
      - name: Capture current Batch 14 UI
        run: pnpm qa:batch14:review-capture
      - name: Verify Batch 57 DeckDetail role ledger
        run: pnpm exec playwright test tests/visual/batch57-deck-detail-role-ledger-review.spec.ts
      - name: Verify Batch 58 DeckDetail command rail
        run: pnpm exec playwright test tests/visual/batch58-deck-detail-command-rail-review.spec.ts
      - name: Verify Batch 59 DeckDetail desktop role ledger
        run: pnpm exec playwright test tests/visual/batch59-deck-detail-desktop-role-ledger-review.spec.ts
      - name: Verify Batch 60 DeckDetail taxonomy ledger
        run: pnpm exec playwright test tests/visual/batch60-deck-detail-taxonomy-ledger-review.spec.ts
      - name: Verify Batch 61 DeckDetail desktop command ledger
        run: pnpm exec playwright test tests/visual/batch61-deck-detail-desktop-command-ledger-review.spec.ts
      - name: Verify Batch 62 DeckList header ledger
        run: pnpm exec playwright test tests/visual/batch62-deck-list-header-ledger-review.spec.ts
      - name: Verify Batch 63 Result desktop score command ledger
        run: pnpm exec playwright test tests/visual/batch23-result-review.spec.ts
      - name: Verify Batch 64 Result total contrast
        run: pnpm exec playwright test tests/visual/batch64-result-total-contrast-review.spec.ts
      - name: Verify Batch 65 Collection desktop archive ledger
        run: pnpm exec playwright test tests/visual/batch65-collection-desktop-archive-ledger-review.spec.ts
      - name: Verify Batch 66 MatchSetup player-count ledger
        run: pnpm exec playwright test tests/visual/batch66-match-setup-player-count-ledger-review.spec.ts
      - name: Verify Batch 67 DeckEditor header command ledger
        run: pnpm exec playwright test tests/visual/batch67-deck-editor-header-command-ledger-review.spec.ts
      - name: Upload visual review artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: batch14-visual-review-${{ github.event.pull_request.number || 'manual' }}-${{ github.sha }}
          path: test-results/batch14-review
          if-no-files-found: warn
          retention-days: 7
