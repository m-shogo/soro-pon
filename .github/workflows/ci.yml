name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Critical integrity contracts
        run: |
          pnpm exec vitest run \
            src/storage/storageRecoveryFailurePaths.test.ts \
            src/storage/localStorageRecordsAtomicity.test.ts \
            src/storage/localStorageCapacity.test.ts \
            src/storage/storageWriteContract.test.ts \
            src/storage/resetLocalData.test.ts \
            src/app/runtimeIds.test.ts \
            src/app/AppRoot.persistence.test.tsx \
            src/engine/validation/validateDeckEntityIds.test.ts
      - name: Batch 14 visual quality contract
        run: pnpm qa:batch14:visual-contract
      - name: Batch 14 visual review hygiene
        run: pnpm qa:batch14:review-hygiene
      - name: Batch 15 home/loadout contract
        run: pnpm qa:batch15:home-contract
      - name: Batch 16 deck detail contract
        run: pnpm qa:batch16:deck-detail-contract
      - name: Batch 17 tile workbench contract
        run: pnpm qa:batch17:tile-workbench-contract
      - name: Batch 18 category workbench contract
        run: pnpm qa:batch18:category-workbench-contract
      - name: Batch 19 bonus workbench contract
        run: pnpm qa:batch19:bonus-workbench-contract
      - name: Batch 20 role workbench contract
        run: pnpm qa:batch20:role-workbench-contract
      - name: Batch 21 adaptive inspector contract
        run: pnpm qa:batch21:adaptive-inspector-contract
      - name: Batch 22 collection ledger contract
        run: pnpm qa:batch22:collection-ledger-contract
      - name: Batch 23 result evidence contract
        run: pnpm qa:batch23:result-evidence-contract
      - name: Batch 24 editor cleanup contract
        run: pnpm qa:batch24:editor-cleanup-contract
      - name: Batch 25 result determinism contract
        run: pnpm qa:batch25:result-determinism-contract
      - name: Batch 26 midgame evidence contract
        run: pnpm qa:batch26:midgame-evidence-contract
      - name: Batch 27 desktop table density contract
        run: pnpm qa:batch27:desktop-table-density-contract
      - name: Batch 28 match coach contract
        run: pnpm qa:batch28:match-coach-contract
      - name: Batch 29 match setup lobby contract
        run: pnpm qa:batch29:match-setup-lobby-contract
      - name: Batch 30 result outcome board contract
        run: pnpm qa:batch30:result-outcome-board-contract
      - name: Batch 31 featured deck selection contract
        run: pnpm qa:batch31:featured-deck-select-contract
      - name: Batch 32 desktop TOP stage contract
        run: pnpm qa:batch32:desktop-top-stage-contract
      - name: Batch 33 collection stamp index contract
        run: pnpm qa:batch33:collection-stamp-index-contract
      - name: Batch 34 basic deck ledger contract
        run: pnpm qa:batch34:basic-deck-ledger-contract
      - name: Batch 35 bonus recipe shelf contract
        run: pnpm qa:batch35:bonus-recipe-shelf-contract
      - name: Interaction UX contract
        run: pnpm qa:interaction-ux
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm skin:validate
      - run: pnpm build

  asset-python:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: tools/asset-factory/soro-pon-ui/requirements.txt
      - name: Create pinned asset-tool venv
        run: |
          python -m venv tools/asset-factory/soro-pon-ui/.venv
          tools/asset-factory/soro-pon-ui/.venv/bin/python -m pip install --disable-pip-version-check \
            -r tools/asset-factory/soro-pon-ui/requirements.txt
          tools/asset-factory/soro-pon-ui/.venv/bin/python -m pip check
      - name: Run asset pipeline fixtures
        run: tools/asset-factory/soro-pon-ui/scripts/run-python-tests.sh
