name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Critical integrity contracts
        run: |
          pnpm exec vitest run \
            src/storage/storageRecoveryFailurePaths.test.ts \
            src/storage/localStorageRecordsAtomicity.test.ts \
            src/storage/localStorageCapacity.test.ts \
            src/storage/storageWriteContract.test.ts \
            src/storage/resetLocalData.test.ts \
            src/app/runtimeIds.test.ts \
            src/app/AppRoot.persistence.test.tsx \
            src/engine/validation/validateDeckEntityIds.test.ts
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm skin:validate
      - run: pnpm build

  asset-python:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: tools/asset-factory/soro-pon-ui/requirements.txt
      - name: Create pinned asset-tool venv
        run: |
          python -m venv tools/asset-factory/soro-pon-ui/.venv
          tools/asset-factory/soro-pon-ui/.venv/bin/python -m pip install --disable-pip-version-check \
            -r tools/asset-factory/soro-pon-ui/requirements.txt
      - name: Run asset pipeline fixtures
        run: tools/asset-factory/soro-pon-ui/scripts/run-python-tests.sh
